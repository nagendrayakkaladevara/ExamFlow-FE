<!doctype html>
<html lang="en" class="dark" data-ag-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = localStorage.getItem('theme')
        var colorTheme = localStorage.getItem('color-theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.dataset.agThemeMode = 'light'
        }
        if (colorTheme === 'claude' || colorTheme === 'tangerine') {
          document.documentElement.dataset.colorTheme = colorTheme
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Student Assessment & Learning Management Platform" />
    <title>ExamFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
